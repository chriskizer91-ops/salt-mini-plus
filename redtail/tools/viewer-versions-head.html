<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Redtail · versions</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#e4e6ea;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
canvas{display:block;touch-action:none}
#info{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top));font-size:12px;color:#4a4f57;letter-spacing:.02em}
#info b{color:#7d1a17}
#ui{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;justify-content:safe center;flex-wrap:nowrap;overflow-x:auto;padding:0 8px;scrollbar-width:none}#ui::-webkit-scrollbar{display:none}
#ui button{flex:none;border:0;border-radius:16px;padding:8px 11px;font:600 13px system-ui,sans-serif;background:rgba(255,255,255,.82);color:#30343a;box-shadow:0 1px 3px rgba(0,0,0,.12)}
#ui button.on{background:#7d1a17;color:#fff}
#ui button.ver{background:#30343a;color:#fff;min-width:52px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#4a4f57;font-size:14px}</style></head>
<body><div id="load">Loading the Redtail…</div><div id="info"></div><div id="ui"></div>
