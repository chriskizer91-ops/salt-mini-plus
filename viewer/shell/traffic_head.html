<!DOCTYPE html><html lang="en" data-data="data/"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Salt Mini Plus · Traffic test</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;font:13px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#e6e5e2;color:#222}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:fixed;left:14px;right:14px;top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:baseline;gap:10px;pointer-events:none}
#title{letter-spacing:.14em;font-size:11px;text-transform:uppercase;opacity:.7;white-space:nowrap}
#stats{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums;text-align:right}
#stats b{font-weight:600}
#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;pointer-events:none}
#ui>*{pointer-events:auto}
button{font:inherit;border:1px solid rgba(127,127,127,.35);background:rgba(255,255,255,.62);color:inherit;border-radius:999px;padding:7px 13px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);-webkit-tap-highlight-color:transparent}
button.on{background:#222;color:#fff;border-color:#222}
.seg{display:flex;border-radius:999px;background:rgba(255,255,255,.62);border:1px solid rgba(127,127,127,.35);padding:2px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.seg button{border:none;background:transparent;padding:6px 12px;backdrop-filter:none;-webkit-backdrop-filter:none}
.seg button.on{background:#222;color:#fff}
#carb::after{content:" ▾";opacity:.6}
/* the car list and the paints open above the bar, one at a time */
.pop .grp{flex-basis:100%;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#77756f;margin-top:4px}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:min(560px,94vw);
  padding:8px;border-radius:18px;background:rgba(255,255,255,.78);border:1px solid rgba(127,127,127,.25);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.sw.on{box-shadow:0 0 0 2px #222}
#hint{position:fixed;left:50%;top:calc(44px + env(safe-area-inset-top));transform:translateX(-50%);font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;transition:opacity .6s;pointer-events:none}
#hint.gone{opacity:0}
#loading{position:fixed;inset:0;display:grid;place-items:center;letter-spacing:.12em;text-transform:uppercase;font-size:12px;pointer-events:none}
#loading span{background:rgba(255,255,255,.75);padding:8px 14px;border-radius:999px}
/* a phone held upright: the stats under the title, the extras (views, lights) tucked into the More list */
@media (max-width:620px){#top{flex-direction:column;gap:3px;align-items:flex-start}#stats{text-align:left}#hint{top:calc(58px + env(safe-area-inset-top))}
  #ui{gap:6px;flex-wrap:nowrap}button{padding:7px 11px}.seg button{padding:6px 9px}.wide{display:none!important}}
@media (min-width:621px){#moreb{display:none!important}}

#stats{line-height:1.5}#stats .who{display:inline-block;min-width:62px;opacity:.6}
#ui{flex-direction:column;gap:6px}#ui .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;pointer-events:auto}
.pop{bottom:calc(104px + env(safe-area-inset-bottom))}
.pop button{min-width:86px}
#versA{max-width:min(460px,94vw)}
</style></head><body>
<canvas id="cv"></canvas>
<div id="top"><div id="title">Salt Mini Plus · Traffic test · Coupe</div><div id="stats"></div></div>
<div id="loading"><span>Building…</span></div>
<div id="versA" class="pop" hidden></div>
<div id="versB" class="pop" hidden></div>
<div id="paints" class="pop" hidden></div>
<div id="ui">
 <div class="row" id="roadui" hidden>
  <div class="seg" id="cams"><button data-c="hood">Hood</button><button data-c="chase">Chase</button><button data-c="far">Far</button><button data-c="look">Look</button></div>
  <div class="seg" id="dists"><button data-d="30">30 m</button><button data-d="100">100 m</button><button data-d="200">200 m</button><button data-d="300">300 m</button></div>
  <button id="dir">Coming at you</button>
 </div>
 <div class="row">
  <div class="seg" id="scn"><button data-s="studio">Studio</button><button data-s="parked">Parked</button><button data-s="road">Road</button></div>
  <button id="ab">Car</button><button id="bb">Your car</button>
  <div class="seg" id="pics" title="Picture size for the baked cars"><button data-p="1">Pictures 2048</button><button data-p="0.5">1024</button><button data-p="0.25">512</button></div>
  <button id="lights">Lamps</button><button id="paintb">Paint</button>
 </div>
</div>
